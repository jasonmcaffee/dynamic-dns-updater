[package]
name = "dynamic-dns-updater"
version = "1.0.0"
edition = "2024"
description = "Keeps Cloudflare DNS records synchronized with a TP-Link router WAN IPv4 address"
license = "MIT"

[dependencies]
aes = "0.9.2"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
ctrlc = "3.5.2"
dotenvy = "0.15.7"
hex = "0.4.3"
md5 = "0.8.0"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
rsa = "0.9.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
url = "2.5.7"
zeroize = "1.8.2"

[dev-dependencies]
tiny_http = "0.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
